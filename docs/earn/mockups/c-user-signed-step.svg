<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386" role="img" aria-label="Mockup C: a user-signed testnet step with the contract checked" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<title>Mockup C: a user-signed testnet step with the contract checked</title>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#7fe7f5"/><stop offset=".55" stop-color="#9ea7ff"/><stop offset="1" stop-color="#f0a7d8"/></linearGradient></defs>
<rect width="720" height="386" fill="#030916"/>
<rect x="16" y="16" width="688" height="354" rx="20" fill="#060d1f" stroke="#1f2c47"/>
<text x="40" y="58" font-size="13" letter-spacing="2" fill="#aebed6">MOCKUP · DESIGN ONLY · NOT AVAILABLE</text>
<text x="40" y="96" font-size="22" font-weight="600" fill="#f3f6ff">Stake 50 ZIG with Valdora</text>
<text x="680" y="96" font-size="14" fill="#9fd8e6" text-anchor="end">zig-test-2 only</text>
<text x="40" y="130" font-size="14" font-weight="600" fill="#9fd8e6">You send</text>
<text x="170" y="130" font-size="15" fill="#dce7f7">50 ZIG</text>
<text x="40" y="158" font-size="14" font-weight="600" fill="#9fd8e6">You receive</text>
<text x="170" y="158" font-size="15" fill="#dce7f7">stZIG, the amount the contract sets</text>
<text x="40" y="186" font-size="14" font-weight="600" fill="#9fd8e6">Contract</text>
<text x="170" y="186" font-size="15" fill="#dce7f7">Valdora staker · code 2532 · checked just now</text>
<text x="40" y="214" font-size="14" font-weight="600" fill="#9fd8e6">Simulated</text>
<text x="170" y="214" font-size="15" fill="#dce7f7">The network accepted this exact message</text>
<text x="40" y="242" font-size="15" fill="#c9d6ea">This is permanent once signed. Getting out takes 21 days or more.</text>
<rect x="40" y="256" width="220" height="44" rx="10" fill="url(#g)"/>
<text x="150" y="283" font-size="15" font-weight="600" fill="#06101f" text-anchor="middle">Review in your wallet</text>
<text x="280" y="283" font-size="14" fill="#c9d6ea">Cancel</text>
<text x="40" y="358" font-size="13" fill="#aebed6">Later phase (E3), testnet only, after a published schema and testnet receipts.</text>
</svg>
