# EXPERIMENT ONLY (experiment/click-hang-repro, DO NOT MERGE).
# Repeats the five tests that hung on a click in CI, once with the Chrome channel exactly as
# Milestone quality installs it and once with Playwright's bundled Chromium. The Milestone quality
# workflow is unchanged. Diagnostics go to the job log.
name: Click-hang experiment
on:
  pull_request:
permissions:
  # write only so each job can commit its diagnostics to experiment/click-hang-results (logs are read via git).
  contents: write
concurrency:
  group: click-hang-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repeat:
    if: github.head_ref == 'experiment/click-hang-repro'
    name: click-hang ${{ matrix.browser }} (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, bundled]
        shard: [1, 2]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_ENVIRONMENT: PUBLIC_ALPHA_UNDEPLOYED
      WRANGLER_SEND_METRICS: "false"
      CLICK_HANG_BROWSER: ${{ matrix.browser }}
      REPEATS: "30"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Install browser
        run: |
          if [ "$CLICK_HANG_BROWSER" = chrome ]; then
            pnpm --filter @zigoals/web exec playwright install --with-deps chrome
            google-chrome --version
          else
            pnpm --filter @zigoals/web exec playwright install --with-deps chromium
          fi
      - run: pnpm build
      - run: pnpm --filter @zigoals/web start > /tmp/zigoals-web.log 2>&1 &
      - name: Point the five specs at the probe (not committed)
        working-directory: apps/web/tests
        run: |
          sed -i -E "s#from ['\"]@playwright/test['\"]#from './click-hang-probe'#" wealth.spec.ts platform-habits.spec.ts habits.spec.ts run11-motion-recording.spec.ts
          grep -n "click-hang-probe" wealth.spec.ts platform-habits.spec.ts habits.spec.ts run11-motion-recording.spec.ts
      - name: Repeat the hung tests
        run: |
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/app >/dev/null; then break; fi
            sleep 1
          done
          set -o pipefail
          env -u NO_COLOR pnpm --filter @zigoals/web exec playwright test --config=playwright.click-hang.config.ts \
            tests/wealth.spec.ts:23 tests/platform-habits.spec.ts:44 tests/habits.spec.ts:18 tests/run11-motion-recording.spec.ts:3 \
            --repeat-each=$REPEATS --workers=2 --shard=${{ matrix.shard }}/2 --reporter=line --output=/tmp/click-hang-results 2>&1 | tee /tmp/click-hang-run.log
      - name: Click-hang diagnostics
        if: always()
        run: |
          echo "::group::summary"
          grep -cE "STUCK CLICK|CLICK FAILED|TEST FAILED" /tmp/click-hang-diag.log || true
          echo "::endgroup::"
          cat /tmp/click-hang-diag.log || echo "no diagnostics written"
          echo "--- server log tail"
          tail -n 60 /tmp/zigoals-web.log || true
      - name: Publish diagnostics to experiment/click-hang-results
        if: always()
        env:
          TOKEN: ${{ github.token }}
          NAME: ${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.browser }}-shard${{ matrix.shard }}
        run: |
          mkdir -p /tmp/out && cd /tmp/out
          git init -q && git config user.name click-hang-experiment && git config user.email click-hang@users.noreply.github.com
          remote="https://x-access-token:${TOKEN}@github.com/${{ github.repository }}"
          for attempt in 1 2 3 4 5 6; do
            if git fetch -q "$remote" experiment/click-hang-results 2>/dev/null; then git checkout -q -B results FETCH_HEAD; else git checkout -q --orphan results 2>/dev/null || git checkout -q results; fi
            mkdir -p "$NAME"
            { echo "sha ${{ github.event.pull_request.head.sha }}"; grep -E "^\s+[0-9]+ (passed|failed|flaky|skipped)|Google Chrome|chromium" /tmp/click-hang-run.log || true; } > "$NAME/summary.txt"
            cp /tmp/click-hang-diag.log "$NAME/diag.log" 2>/dev/null || echo "no diagnostics" > "$NAME/diag.log"
            grep -E "^\s+[0-9]+\) |Error|Call log|- " /tmp/click-hang-run.log | head -400 > "$NAME/failures.txt" || true
            git add -A && git commit -q -m "click-hang results $NAME" || true
            if git push -q "$remote" results:experiment/click-hang-results; then echo "published $NAME"; exit 0; fi
            sleep $((attempt * 5))
          done
          echo "could not publish diagnostics"; exit 1
