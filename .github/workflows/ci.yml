name: Milestone quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The web gate is split into independent jobs that run in parallel. Every
  # step of the former single web job still runs, unchanged, in one of them.
  # The final "web" job keeps the check name and fails unless all of them
  # succeeded. Timeouts: see the headroom notes in each job.
  web-checks:
    name: web checks (lint, types, unit, build, audit, secret scan)
    runs-on: ubuntu-24.04
    # Measured 3.7 min on the first split run (36489960661); about 2.5x headroom.
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_ENVIRONMENT: PUBLIC_ALPHA_UNDEPLOYED
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # FIX_PLAN F2 (Q-SC-03): pnpm from Node's own Corepack, refused unless its bytes match the registry's sha512 for
      # pnpm 11.19.0; package.json keeps "pnpm@11.19.0", which the pnpm shim then runs from this verified copy.
      - run: corepack enable pnpm && corepack install --global pnpm@11.19.0+sha512.7881f3ed590d472c4a955e2b88b2121791116066dcc88cbca3849ec9b60f1bbaa6d2ccb221fa91da4e1c65bef2bcbe379365aea7ac539c7bf86dedc3a1b22dce
      - run: pnpm install --frozen-lockfile
      - run: node scripts/doctor.mjs
      - run: pnpm check:deploy-configs && pnpm check:landing
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - run: pnpm audit --prod --audit-level high
      # FIX_PLAN F1 (Q-SC-02): every dependency, development ones included, reported as a warning and never a failure.
      # The step above still fails on production advisories. Known on 2026-10-05: braces <=3.0.3 (GHSA-vfj7-8cjw-p6xm)
      # through eslint-config-next, lint-time only, with no patched braces published yet.
      - name: pnpm audit, all dependencies (warning only)
        run: pnpm audit --audit-level high || echo "::warning title=pnpm audit (all dependencies)::Advisories in development dependencies; read this step's log (FIX_PLAN F1)."
      - run: node scripts/check-secrets.mjs
  web-browser:
    name: web browser suite (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    # The whole suite took 15-20 min in one job. Split three ways (2 workers
    # each) the shards measured 7.6-8.4 min including about 1.5 min of setup
    # and build (run 36489960661). About 2x headroom for suite growth and
    # slower runners.
    # Session V (2026-10-06): on main the slowest shard took 21m14s of the
    # 22 min (run 37347264034) and 21m08s (run 37319517371); with Session V's
    # ZIGi specs one finished its tests and was cancelled at 22m02s (run
    # 37391078178). 30 min gives about 40% headroom again.
    # Session X (2026-10-08): with Session X's specs shards 2 and 3 took 28m45s and
    # 27m40s, and shard 1 was cancelled at 30 min with 575 of its 589 tests done
    # and still moving (run 37784457470). 45 min gives about 40% headroom again.
    # Session Y (2026-10-09): shard 1 took 40m20s on main e30b7c6 (run 37853695437) and 42m23s with Session Y's hydration
    # guard (20 pages in three zones, run 37988501137). 60 min gives about 40% headroom again.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_ENVIRONMENT: PUBLIC_ALPHA_UNDEPLOYED
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # FIX_PLAN F2 (Q-SC-03): pnpm from Node's own Corepack, refused unless its bytes match the registry's sha512 for
      # pnpm 11.19.0; package.json keeps "pnpm@11.19.0", which the pnpm shim then runs from this verified copy.
      - run: corepack enable pnpm && corepack install --global pnpm@11.19.0+sha512.7881f3ed590d472c4a955e2b88b2121791116066dcc88cbca3849ec9b60f1bbaa6d2ccb221fa91da4e1c65bef2bcbe379365aea7ac539c7bf86dedc3a1b22dce
      - run: pnpm install --frozen-lockfile
      # The runner image ships Google Chrome stable at Playwright's chrome
      # channel path; chrome-deps.sh keeps it, installs the channel only when
      # it is missing, and asks apt only for Chrome packages dpkg reports
      # missing (Session P, 1.6: no 21 MB of fonts from the slow mirror). When
      # Chrome must come from dl.google.com, which intermittently resets the
      # download (curl HTTP/2 INTERNAL_ERROR) or hangs: up to 3 attempts of
      # at most 3 min each, 15 s then 45 s apart. Before each retry the script
      # waits for any apt/dpkg lock that a timed-out attempt left held, as long
      # as the 12-min step still fits one attempt.
      - name: Install Chrome for Playwright (up to 3 attempts)
        run: bash scripts/ci/install-chrome.sh bash scripts/ci/chrome-deps.sh
      - run: pnpm build
      - run: pnpm --filter @zigoals/web start > /tmp/zigoals-web.log 2>&1 &
      - env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: /tmp/zigoals-web-results.json
        run: |
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/app >/dev/null; then break; fi
            sleep 1
          done
          env -u NO_COLOR pnpm --filter @zigoals/web exec playwright test --workers=2 --shard=${{ matrix.shard }}/3 --reporter=line,json --output=/tmp/zigoals-web-results
      - name: Retain fixture-only browser failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-browser-${{ github.sha }}-shard-${{ matrix.shard }}
          path: |
            /tmp/zigoals-web-results.json
            /tmp/zigoals-web-results/
          if-no-files-found: warn
          retention-days: 7
  web-integration:
    name: web integration (account, market, Run11 package, Alpha gate)
    runs-on: ubuntu-24.04
    # Measured 5.7 min (integration 2.2 min, Alpha build and package topology
    # 1.7 min, Workers security gate 0.5 min; run 36489960661). About 2.5x
    # headroom: the account browser tests wait up to 30 s per step on failure.
    # The browser integration files now run one at a time (see that step).
    # Measured locally on 4 vCPUs: the whole step takes 185 s, about 35 s
    # more than in parallel, so the job stays well inside 15 min.
    # Session U adds the packaged price contract: a second Alpha dry run and
    # six workerd tests, about 30 s locally. Session W Part 22 adds the page
    # weight check against the served build, a few seconds.
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_ENVIRONMENT: PUBLIC_ALPHA_UNDEPLOYED
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # FIX_PLAN F2 (Q-SC-03): pnpm from Node's own Corepack, refused unless its bytes match the registry's sha512 for
      # pnpm 11.19.0; package.json keeps "pnpm@11.19.0", which the pnpm shim then runs from this verified copy.
      - run: corepack enable pnpm && corepack install --global pnpm@11.19.0+sha512.7881f3ed590d472c4a955e2b88b2121791116066dcc88cbca3849ec9b60f1bbaa6d2ccb221fa91da4e1c65bef2bcbe379365aea7ac539c7bf86dedc3a1b22dce
      - run: pnpm install --frozen-lockfile
      # Session Y Part 2 (ADR-018 Y11): the unit files whose results once depended on the machine's zone, and the time
      # engines, run again in two zones on either side of UTC: Chatham (UTC+13:45/+12:45, already the next day for most of
      # the UTC day) and New York (UTC-4/-5). Web checks keep running the whole suite in UTC.
      - name: Time-zone unit sweep (Chatham, New York)
        run: |
          files="apps/web/lib/vault/read-support.test.ts apps/web/lib/ai/actions/plan.test.ts apps/web/lib/contribution-habit.test.ts apps/web/lib/vault/export-roundtrip.test.ts apps/web/lib/habit-linked-policy.test.ts apps/web/lib/ai/context-pack/build.test.ts apps/web/lib/vault/zod-jitless.test.ts apps/web/lib/skills/chess/chess.test.ts apps/web/lib/ai/tools/tools.test.ts apps/web/lib/ai/local-answers/engine.test.ts apps/web/lib/fasting/engine.test.ts apps/web/lib/journal-zone.test.ts apps/web/lib/local-date.test.ts apps/web/lib/zone-time.test.ts apps/web/lib/push/labels.test.ts"
          for zone in Pacific/Chatham America/New_York; do echo "TZ=$zone"; TZ=$zone pnpm exec vitest run $files; done
      # Same script and retry as the browser shards; see there.
      - name: Install Chrome for Playwright (up to 3 attempts)
        run: bash scripts/ci/install-chrome.sh bash scripts/ci/chrome-deps.sh
      - run: pnpm build
      - run: pnpm --filter @zigoals/web start > /tmp/zigoals-web.log 2>&1 &
      # One file at a time: each file drives real Chrome and a local workerd,
      # and in parallel they starve each other of CPU on the 4-vCPU runner.
      # account-browser a-first (about 64 s of work alone) then ran 72-89 s
      # and timed out at 90 s three times (#41, #42, #44).
      - name: Independent browser account and market integration
        env:
          RUN10_BROWSER: "1"
          RUN11_MARKET_BROWSER: "1"
          RUN11_REVIEW_ORIGIN: http://127.0.0.1:3100
          # The source-preview Goal controls check in packaged-runtime.test.mjs
          # (its /api calls are answered by a fixture 503). The packaged
          # artifact test in that file stays gated by RUN11_PACKAGED below.
          RUN11_GOAL_SOURCE: "1"
          RUN11_GOAL_ORIGIN: http://127.0.0.1:3100
        run: |
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/app >/dev/null; then break; fi
            sleep 1
          done
          pnpm exec vitest run scripts/run10/account-browser.test.mjs scripts/run11/account-switch-browser.test.mjs scripts/run11/sync-self-conflict-browser.test.mjs scripts/run11/sync-lost-ack-browser.test.mjs scripts/run11/sync-inflight-edit-browser.test.mjs scripts/run11/health-consent-verification-browser.test.mjs scripts/run11/health-consent-a11y-browser.test.mjs scripts/run11/market-browser.test.mjs scripts/run11/market-disconnect.test.mjs scripts/run11/packaged-runtime.test.mjs scripts/run11/stage8-rehearsal/sign-in-codes-browser.test.mjs scripts/run11/stage8-rehearsal/lock-switch-browser.test.mjs scripts/run11/stage8-rehearsal/health-consent-cloud-browser.test.mjs scripts/run11/stage8-rehearsal/replay-browser.test.mjs scripts/run11/stage8-rehearsal/camera-browser.test.mjs scripts/run11/stage8-rehearsal/sync-offer-browser.test.mjs scripts/run11/stage8-rehearsal/remember-device-browser.test.mjs --no-file-parallelism --reporter=verbose
      # Session W Part 22: page weight (gzip of the scripts each page loads) for every app page and the shell they
      # share, against scripts/weight-budgets.json, on the production build served above. A few seconds, loopback only.
      - name: Page weight budgets
        run: node scripts/check-weight-budget.mjs http://127.0.0.1:3100
      - run: pnpm --filter @zigoals/web build:alpha
      - run: pnpm --filter @zigoals/web check:alpha
      # Session U Part 2c: the generated Alpha artifact's live-price contract (Session S Part 8) on every change.
      # Hermetic: the dry run's bundle in workerd with stand-in coordinators; outbound requests throw; no credentials.
      - name: Alpha artifact live-price contract (packaged)
        run: |
          pnpm --filter @zigoals/web exec wrangler deploy --config wrangler.alpha.jsonc --dry-run --outdir /tmp/zigoals-alpha-dry
          ALPHA_PACKAGED=1 ALPHA_PACKAGE_BUNDLE=/tmp/zigoals-alpha-dry/worker.js pnpm exec vitest run scripts/run11/alpha-packaged-prices.test.mjs --reporter=verbose
      # Session W Part 27: the same dry-run bundle's effective headers, hermetic as above: Permissions-Policy and connect-src
      # per app route, the build identity (X-ZIGoals-Build), and a missing /_next/static/ file's plain 404 (alpha/worker.mjs).
      - name: Alpha artifact headers (packaged)
        run: ALPHA_PACKAGED=1 ALPHA_PACKAGE_BUNDLE=/tmp/zigoals-alpha-dry/worker.js pnpm exec vitest run scripts/run11/alpha-packaged-headers.test.mjs --reporter=verbose
      - name: Full generated Run11 package and local service topology
        run: |
          node scripts/run11/activation-check.mjs --source "$GITHUB_SHA" --dry-run
          RUN11_PACKAGED=1 RUN11_PACKAGE_BUNDLE=/tmp/zigoals-run11-dry-app/worker.js pnpm exec vitest run scripts/run11/packaged-runtime.test.mjs --reporter=verbose
      - run: pnpm --filter @zigoals/web preview:alpha > /tmp/zigoals-alpha.log 2>&1 &
      - name: Public Alpha Workers security gate
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8788
        run: |
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8788/app >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8788/app >/dev/null
          env -u NO_COLOR pnpm --filter @zigoals/web exec playwright test public-alpha.spec.ts diagnostics.spec.ts --workers=2 --output=/tmp/zigoals-alpha-results
      # Session X Part 6: the gate's traces were written and discarded, so public-alpha:119's one timeout (run 37663282444)
      # could not be root-caused. Kept like the browser shards' (fixture data only, no secrets), on failure too.
      - name: Retain the Alpha gate's traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-alpha-gate-${{ github.sha }}
          path: /tmp/zigoals-alpha-results/
          if-no-files-found: ignore
          retention-days: 7
  web-webkit:
    # Session Y Part 6 ([TIER 3] (CI), ADR-018 Y4): the same app in Playwright's WebKit (Safari's engine) for the pinned
    # Playwright 1.63 (WebKit 26.6), the one owner-approved browser download: the smoke, the ZIGi suites
    # (playwright.webkit.config.ts selects them; real-model, conversation and on-device specs stay out) and the curated
    # phone set (tests/webkit-phone.spec.ts), two workers. Evidence label "WebKit", never "Safari on an iPhone".
    # Part of the aggregate "web" check since it was green twice in a row on PR #80 (runs 38010192191 on e2442be and
    # 38014291306 on 742bbac, 34 min each; ADR-018 Y4, Y41), so it runs wherever the other web jobs run.
    # 45 min: the first run (df436a1) needed about 36 min for its 396 tests and stopped at 30.
    name: web WebKit (smoke, ZIGi, phone set)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_ENVIRONMENT: PUBLIC_ALPHA_UNDEPLOYED
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # FIX_PLAN F2 (Q-SC-03): pnpm from Node's own Corepack, as in the other jobs.
      - run: corepack enable pnpm && corepack install --global pnpm@11.19.0+sha512.7881f3ed590d472c4a955e2b88b2121791116066dcc88cbca3849ec9b60f1bbaa6d2ccb221fa91da4e1c65bef2bcbe379365aea7ac539c7bf86dedc3a1b22dce
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright's WebKit (owner-approved download)
        run: pnpm --filter @zigoals/web exec playwright install --with-deps webkit
      - run: pnpm build
      - run: pnpm --filter @zigoals/web start > /tmp/zigoals-web.log 2>&1 &
      - name: WebKit suite
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
        run: |
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/app >/dev/null; then break; fi
            sleep 1
          done
          env -u NO_COLOR pnpm --filter @zigoals/web exec playwright test -c playwright.webkit.config.ts --workers=2 --reporter=line --output=/tmp/zigoals-webkit-results
      - name: Retain the WebKit traces (failures and timeouts only)
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-webkit-${{ github.sha }}
          path: /tmp/zigoals-webkit-results/
          if-no-files-found: warn
          retention-days: 7
  web:
    # Keeps the "web" check name. Passes only if every web job passed.
    needs: [web-checks, web-browser, web-integration, web-webkit]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          CHECKS: ${{ needs.web-checks.result }}
          BROWSER: ${{ needs.web-browser.result }}
          INTEGRATION: ${{ needs.web-integration.result }}
          WEBKIT: ${{ needs.web-webkit.result }}
        run: |
          echo "web-checks: $CHECKS; web-browser: $BROWSER; web-integration: $INTEGRATION; web-webkit: $WEBKIT"
          test "$CHECKS" = success && test "$BROWSER" = success && test "$INTEGRATION" = success && test "$WEBKIT" = success
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo install cosmwasm-check --version 2.2.2 --locked --root .toolchain/check
      # FIX_PLAN F2 (Q-SC-03): binaryen from the release toolchain's lockfile (integrity-checked), as reproducibility.yml does.
      - run: npm ci --prefix scripts/release/toolchain --ignore-scripts --no-audit --no-fund
      - run: bash contracts/goal-manager/scripts/build-wasm.sh
        env:
          BINARYEN_JS: ${{ github.workspace }}/scripts/release/toolchain/node_modules/binaryen/bin/wasm-opt
      - run: |
          corepack enable pnpm && corepack install --global pnpm@11.19.0+sha512.7881f3ed590d472c4a955e2b88b2121791116066dcc88cbca3849ec9b60f1bbaa6d2ccb221fa91da4e1c65bef2bcbe379365aea7ac539c7bf86dedc3a1b22dce
          pnpm install --frozen-lockfile
          cargo schema --locked
          node contracts/goal-manager/scripts/generate-types.mjs
          git diff --exit-code -- contracts/goal-manager/schema packages/shared-types/src/contract.generated.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: goal-manager-linux-${{ github.sha }}
          path: |
            artifacts/zigoals_goal_manager.wasm
            artifacts/checksums.txt
            artifacts/build-report.json
          if-no-files-found: error
          retention-days: 30
