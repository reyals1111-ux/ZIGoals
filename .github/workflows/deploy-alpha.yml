name: Manual Alpha deployment
run-name: Alpha ${{ inputs.expected_commit }} dispatched by ${{ github.actor }}

# Deliberately no push, pull_request, workflow_run, workflow_call or schedule.
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full reviewed current main SHA (40 lowercase hexadecimal characters)
        required: true
        type: string
      owner_approval:
        description: I approve deploying this exact main commit to zigoals-alpha only
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

# Global for this Worker, including owner approval, rollback capture and smoke.
# Never interrupt an upload to make room for a newer dispatch.
concurrency:
  group: zigoals-alpha-deployment
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  EXPECTED_COMMIT: ${{ inputs.expected_commit }}
  OWNER_APPROVAL: ${{ inputs.owner_approval }}
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_APP_ENVIRONMENT: PUBLIC_ALPHA_UNDEPLOYED
  WRANGLER_SEND_METRICS: "false"

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject unauthorized refs, actors and reruns before checkout
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = reyals1111-ux/ZIGoals
          # Session U Part 7: the owner, or exactly the Claude GitHub App's bot (docs/deployment/AGENT_DISPATCH.md);
          # the alpha approval below stays the owner's alone.
          test "$GITHUB_ACTOR" = reyals1111-ux || test "$GITHUB_ACTOR" = 'claude[bot]'
          test "$GITHUB_TRIGGERING_ACTOR" = "$GITHUB_ACTOR"
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/main
          test "$OWNER_APPROVAL" = true
          [[ "$EXPECTED_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - name: Verify current main and configured owner environment protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/alpha-deploy.mjs authorize

  # Third-party install, test and build code runs here, in a job with no environment,
  # no Cloudflare or CoinGecko credential and only the read-only GITHUB_TOKEN. Its only
  # product is the packed .open-next output and that archive's SHA-256.
  build:
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      # FIX_PLAN F2 (Q-SC-03): pnpm from Node's own Corepack, refused unless its bytes match the registry's sha512 for
      # pnpm 11.19.0 (the same pin as ci.yml); package.json keeps "pnpm@11.19.0".
      - run: corepack enable pnpm && corepack install --global pnpm@11.19.0+sha512.7881f3ed590d472c4a955e2b88b2121791116066dcc88cbca3849ec9b60f1bbaa6d2ccb221fa91da4e1c65bef2bcbe379365aea7ac539c7bf86dedc3a1b22dce
      - name: Verify exact main before building
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/alpha-deploy.mjs source
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Deployment config and regression gates
        run: |
          pnpm check:deploy-configs
          pnpm lint
          pnpm typecheck
          pnpm test
      - name: Build and dry-run Alpha without deployment credentials
        run: |
          pnpm --filter @zigoals/web build:alpha
          pnpm --filter @zigoals/web check:alpha
      - name: Verify clean exact-source Alpha build
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/alpha-deploy.mjs build
      - name: Pack the built Worker and record its hash
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/alpha-build"
          archive="$RUNNER_TEMP/alpha-build/open-next.tar"
          tar -C apps/web --sort=name --owner=0 --group=0 --numeric-owner -cf "$archive" .open-next
          sum=$(sha256sum "$archive" | cut -d' ' -f1)
          [[ "$sum" =~ ^[a-f0-9]{64}$ ]]
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"
          echo "Alpha build archive SHA-256: \`$sum\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alpha-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/alpha-build/open-next.tar
          if-no-files-found: error
          retention-days: 7

  # Credentials exist only here, behind the owner-approved alpha environment. This job
  # never builds: it deploys the build job's archive only after its hash matches.
  deploy:
    needs: [authorize, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: alpha
      url: https://alpha.zigoals.app/app
    outputs:
      new_version_id: ${{ steps.publish.outputs.new_version_id }}
      rollback_version_id: ${{ steps.publish.outputs.rollback_version_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      # FIX_PLAN F2 (Q-SC-03): pnpm from Node's own Corepack, refused unless its bytes match the registry's sha512 for
      # pnpm 11.19.0 (the same pin as ci.yml); package.json keeps "pnpm@11.19.0".
      - run: corepack enable pnpm && corepack install --global pnpm@11.19.0+sha512.7881f3ed590d472c4a955e2b88b2121791116066dcc88cbca3849ec9b60f1bbaa6d2ccb221fa91da4e1c65bef2bcbe379365aea7ac539c7bf86dedc3a1b22dce
      - name: Verify exact main after owner approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/alpha-deploy.mjs source
      # Lifecycle scripts stay disabled; only the pinned deploy tooling is installed.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: alpha-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/alpha-build
      - name: Verify the build archive hash and unpack only .open-next
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          archive="$RUNNER_TEMP/alpha-build/open-next.tar"
          [[ "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]]
          echo "$EXPECTED_SHA256  $archive" | sha256sum --check --strict -
          test ! -e apps/web/.open-next
          # Only .open-next/ paths; only regular files, directories and relative symlinks
          # that resolve inside .open-next/ (pnpm's layout). The data filter guards again.
          python3 - "$archive" <<'PY'
          import posixpath, sys, tarfile
          root = ".open-next"
          with tarfile.open(sys.argv[1]) as archive:
              for member in archive.getmembers():
                  name = member.name
                  if name != root and not name.startswith(root + "/") or ".." in name.split("/"):
                      sys.exit(f"Unexpected archive path: {name}")
                  if member.issym():
                      target = posixpath.normpath(posixpath.join(posixpath.dirname(name), member.linkname))
                      if member.linkname.startswith("/") or not target.startswith(root + "/"):
                          sys.exit(f"Link leaves {root}: {name}")
                  elif not (member.isfile() or member.isdir()):
                      sys.exit(f"Unexpected archive entry type: {name}")
              archive.extractall("apps/web", filter="data")
          PY
      - name: Verify the unpacked build is this exact source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/alpha-deploy.mjs build
      - name: Capture current rollback version and validate live Alpha
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ALPHA_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ALPHA_API_TOKEN }}
        run: node scripts/alpha-deploy.mjs capture
      - name: Retain rollback evidence before any upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alpha-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zigoals-alpha-evidence/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Recheck main and rollback, deploy only Alpha, verify rollout and HTTP security
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ALPHA_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ALPHA_API_TOKEN }}
        run: node scripts/alpha-deploy.mjs deploy
      - name: Report version IDs even after failure
        if: ${{ always() }}
        run: node scripts/alpha-deploy.mjs summary
      - name: Retain final deployment evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alpha-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/zigoals-alpha-evidence/*.json
            ${{ runner.temp }}/zigoals-alpha-evidence/wrangler-output.jsonl
          if-no-files-found: warn
          retention-days: 90
