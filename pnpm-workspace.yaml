packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: false
  workerd: false
  unrs-resolver: false
overrides:
  # In-range audit fix (GHSA-qhr7-859c-m2p7, GHSA-6j4f-fj2g-mc7p, GHSA-q2hr-2g5m-vwhr):
  # minimatch 10 (ESLint tooling only) declares brace-expansion ^5.0.8, but
  # `pnpm update --depth Infinity` keeps the locked 5.0.9. Remove once the lock
  # resolves >=5.0.12 without it.
  "minimatch@10>brace-expansion": ^5.0.12
  # In-range audit fix (GHSA-68fv-2mgg-jv7q): postcss (through next) declares
  # source-map-js ^1.2.1, but `pnpm update --depth Infinity` keeps the locked
  # 1.2.1. Remove once the lock resolves >=1.2.2 without it.
  "postcss>source-map-js": ^1.2.2
  # In-range audit fix (GHSA-wq5f-xc86-pv6w): next declares sharp ^0.35.4
  # (optional), but `pnpm update sharp --depth Infinity` keeps the locked
  # 0.35.4. Remove once the lock resolves >=0.35.5 without it.
  "next>sharp": ^0.35.5
  # Session W Part 1c, in-range audit fix (GHSA-jqcg-44mw-7w3h, critical): express
  # (through @opennextjs/aws) declares proxy-addr ^2.0.7, but
  # `pnpm update proxy-addr --depth Infinity` keeps the locked 2.0.7. Remove once
  # the lock resolves >=2.0.8 without it.
  "express>proxy-addr": ^2.0.8
  # Session W Part 1c, narrowest audit fix (GHSA-wq5f-xc86-pv6w, librsvg
  # CVE-2026-96889): miniflare (through wrangler, local and test runtime only)
  # pins sharp to exactly 0.35.4; the patch release 0.35.5 is the fix. Remove once
  # miniflare pins >=0.35.5.
  "miniflare>sharp": 0.35.5
  # Session AH Part 1, audit fix (GHSA-698v-4r3x-3vcv, GHSA-r825-w8mm-5pxw,
  # GHSA-587h-7wmj-h5pm, GHSA-9jrq-w75r-8gcw, GHSA-rq7h-c2jc-7f22,
  # GHSA-vfpm-58rq-9qcg; AF14 launch-editor): vite reaches the tree only as
  # vitest's peer (test runner, dev server never used); the locked 8.3.0 is
  # vulnerable, 8.3.3 is the first fixed patch. Remove once the lock resolves
  # >=8.3.3 without it.
  "vite": 8.3.3
  # Session AH Part 1, audit fix (GHSA-5j98-mcp5-4vw2, high; the glob CLI's
  # -c/--cmd only): @node-minify/core 9.0.2 (through @opennextjs/aws, build
  # tooling) pins glob to exactly 10.3.3; no 10.3.x or 10.4.x fix exists, 10.5.0
  # is the first fixed release (same major). Remove once @node-minify/core pins
  # >=10.5.0.
  "@node-minify/core>glob": 10.5.0
  # Session AH Part 1, audit fix (GHSA-27r3-jxmh-p828, high): express 5.2.1
  # (through @opennextjs/aws, build and local tooling) declares body-parser
  # ^2.2.1 and the lock holds 2.3.0; no 2.3.x fix exists, 2.4.0 is the first
  # fixed release. Remove once the lock resolves >=2.4.0 without it.
  "express>body-parser": 2.4.0
