[workspace]
members = ["contracts/goal-manager"]
resolver = "2"

[workspace.dependencies]
cosmwasm-schema = "=2.2.2"
cosmwasm-std = { version = "=2.2.2", features = ["cosmwasm_2_2"] }
cw-storage-plus = "=2.0.0"
cw2 = "=2.0.0"
cw-utils = "=2.0.0"
thiserror = "2"
cw-multi-test = "=2.2.0"

[profile.release]
codegen-units = 1
incremental = false
lto = true
opt-level = 3
overflow-checks = true
panic = "abort"
strip = true
